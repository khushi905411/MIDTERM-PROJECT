<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>HTML Quiz</h1>
    </header>
    
    <div class="container">
        <div class="quiz">
            <h2>Question 1: What is the correct HTML element for the largest heading?</h2>
            <ul>
                <li><input type="radio" name="q1" id="q1a"><label for="q1a">&lt;h1&gt;</label></li>
                <li><input type="radio" name="q1" id="q1b"><label for="q1b">&lt;heading&gt;</label></li>
                <li><input type="radio" name="q1" id="q1c"><label for="q1c">&lt;h6&gt;</label></li>
            </ul>
        </div>

        <div class="quiz">
            <h2>Question 2: Which HTML element is used to define a paragraph?</h2>
            <ul>
                <li><input type="radio" name="q2" id="q2a"><label for="q2a">&lt;p&gt;</label></li>
                <li><input type="radio" name="q2" id="q2b"><label for="q2b">&lt;paragraph&gt;</label></li>
                <li><input type="radio" name="q2" id="q2c"><label for="q2c">&lt;para&gt;</label></li>
            </ul>
        </div>

        <div class="quiz">
            <h2>Question 3: What is the correct HTML element for inserting an image?</h2>
            <ul>
                <li><input type="radio" name="q3" id="q3a"><label for="q3a">&lt;img&gt;</label></li>
                <li><input type="radio" name="q3" id="q3b"><label for="q3b">&lt;image&gt;</label></li>
                <li><input type="radio" name="q3" id="q3c"><label for="q3c">&lt;picture&gt;</label></li>
            </ul>
        </div>
    </div>
</body>
</html>
